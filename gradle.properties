# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the Gradle daemon process.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Run Gradle in parallel across independent modules for faster builds.
org.gradle.parallel=true

# Enable the build cache to reuse outputs of tasks (especially across clean builds).
org.gradle.caching=true

# Configuration cache: skip the configuration phase entirely when nothing changed.
org.gradle.configuration-cache=true
# Process configuration cache entries in parallel.
org.gradle.configuration-cache.parallel=true

# Reuse a long-lived daemon for faster subsequent builds.
org.gradle.daemon=true

# Use the project's Java 17 toolchain (avoid Gradle picking another JVM).
org.gradle.java.installations.auto-download=false

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# AndroidX: required for all AndroidX/Compose dependencies.
android.useAndroidX=true
# Only generate R classes for the module's own resources -> smaller & faster builds.
android.nonTransitiveRClass=true
